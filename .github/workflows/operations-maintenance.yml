name: Operations Maintenance

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: vehigo-operations-maintenance
  cancel-in-progress: false

env:
  APP_URL: https://vehigo-kappa.vercel.app

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Recover leases and enforce retention
        run: |
          curl -sS -X POST "$APP_URL/api/operations/maintenance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --retry 2 \
            --retry-all-errors \
            --max-time 90 \
            --fail-with-body
