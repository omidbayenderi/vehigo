name: Scanner Cron

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "31 9 * * *"
    - cron: "31 21 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which endpoint to trigger"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - digest

env:
  APP_URL: https://vehigo-kappa.vercel.app

jobs:
  scan:
    if: |
      github.event.schedule == '*/10 * * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'run')
    runs-on: ubuntu-latest
    concurrency:
      group: vehigo-scanner
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - name: Trigger scanner run
        run: |
          curl -sS --connect-timeout 10 --max-time 240 -X POST "$APP_URL/api/scanner/run" \
            -H "x-scanner-secret: ${{ secrets.SCANNER_INGEST_SECRET }}" \
            --fail-with-body

  digest:
    if: |
      github.event.schedule == '31 9 * * *' ||
      github.event.schedule == '31 21 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'digest')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger opportunity digest
        run: |
          curl -sS --connect-timeout 10 --max-time 240 -X POST "$APP_URL/api/scanner/digest?hours=12" \
            -H "x-scanner-secret: ${{ secrets.SCANNER_INGEST_SECRET }}" \
            --fail-with-body
